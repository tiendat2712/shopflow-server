server:
  port: 8080

spring:
  application:
    name: shopflow-backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/shopflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mongodb:
    uri: ${MONGODB_URI}

  data:
    mongodb:
      auto-index-creation: true


jwt:
  secret: ${JWT_SECRET_BASE64}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
