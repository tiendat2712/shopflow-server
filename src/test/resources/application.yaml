spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.2}:${DB_PORT:3307}/shopflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/shopflow_test}

  data:
    mongodb:
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET_BASE64:c2hvcGZsb3ctbG9jYWwtdGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyYiE=}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
  dataset:
    local-dir: ${DATASET_LOCAL_DIR:build/tmp/test-dataset}
    kaggle-slug: ${KAGGLE_DATASET_SLUG:abhayayare/e-commerce-dataset}
    kaggle-username: ${KAGGLE_USERNAME:}
    kaggle-key: ${KAGGLE_KEY:}
    default-user-password: ${DATASET_DEFAULT_USER_PASSWORD:ShopFlow@123!}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: true
  root-folder: ${CLOUDINARY_ROOT_FOLDER:shopflow}
